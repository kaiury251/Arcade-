name: Build AppImage

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Gerar AppImage
        run: npm run dist

      - name: Guardar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Arcade-AppImage
          path: dist/*.AppImage

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Arcade
          files: dist/*.AppImage
